services:
  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - agent
    restart: unless-stopped
    networks:
      - blog-net

  app:
    image: allure12316/blog:latest
    container_name: blog-app
    env_file: .env
    environment:
      - DB_PATH=/app/data/blog.db
      - PORT=8080
      - GIN_MODE=release
      - AGENT_URL=http://agent:8000
    volumes:
      - blog-data:/app/data
      - blog-uploads:/app/web/static/uploads
    restart: unless-stopped
    networks:
      - blog-net

  # 短期记忆/日计数为进程内存实现（单 worker 运行），无需外部 Redis
  agent:
    image: allure12316/blog-agent:latest
    container_name: blog-agent
    env_file: ./agent/.env
    environment:
      - BLOG_API_BASE=http://app:8080
    restart: unless-stopped
    networks:
      - blog-net

volumes:
  blog-data:
  blog-uploads:
  caddy-data:
  caddy-config:

networks:
  blog-net:
    driver: bridge
